<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disaster Watch — Alertas globales GDACS</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>DISASTER&nbsp;WATCH</h1>
    </div>
    <div class="filters">
      <button class="filter-btn active" data-type="all">Todos</button>
      <button class="filter-btn" data-type="EQ">Terremotos</button>
      <button class="filter-btn" data-type="TC">Ciclones</button>
      <button class="filter-btn" data-type="FL">Inundaciones</button>
      <button class="filter-btn" data-type="VO">Volcanes</button>
      <button class="filter-btn" data-type="DR">Sequías</button>
      <button class="filter-btn" data-type="WF">Incendios</button>
    </div>
    <div class="alert-filters">
      <button class="alert-btn active" data-level="green">Verde</button>
      <button class="alert-btn active" data-level="orange">Naranja</button>
      <button class="alert-btn active" data-level="red">Rojo</button>
    </div>
  </header>

  <main id="map"></main>

  <aside id="panel" class="panel hidden">
    <button id="panel-close" aria-label="Cerrar">×</button>
    <div id="panel-content"></div>
  </aside>

  <div id="error-banner" class="error-banner hidden"></div>
  <div id="loading-banner" class="loading-banner">Cargando eventos…</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
