<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Disaster Watch — Alertas globales GDACS</title>
  <meta name="description" content="Mapa en tiempo (casi) real de alertas globales de catástrofes —terremotos, ciclones, inundaciones, volcanes, incendios y sequías— con datos públicos de GDACS. Sin backend, instalable como PWA.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://disaster-watch-seven.vercel.app/">
  <meta property="og:title" content="Disaster Watch — Alertas globales GDACS">
  <meta property="og:description" content="Mapa en tiempo (casi) real de alertas globales de catástrofes —terremotos, ciclones, inundaciones, volcanes, incendios y sequías— con datos públicos de GDACS. Sin backend, instalable como PWA.">
  <meta property="og:image" content="https://disaster-watch-seven.vercel.app/screenshot.png">
  <meta property="og:image:width" content="1400">
  <meta property="og:image:height" content="875">
  <meta property="og:locale" content="es_ES">
  <meta property="og:locale:alternate" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Disaster Watch — Alertas globales GDACS">
  <meta name="twitter:description" content="Mapa en tiempo (casi) real de alertas globales de catástrofes —terremotos, ciclones, inundaciones, volcanes, incendios y sequías— con datos públicos de GDACS. Sin backend, instalable como PWA.">
  <meta name="twitter:image" content="https://disaster-watch-seven.vercel.app/screenshot.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0a0f0a">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Disaster Watch">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <h1 data-i18n="title">DISASTER&nbsp;WATCH</h1>
      <button id="refresh-btn" class="help-btn" data-i18n-aria="refreshAria" aria-label="Actualizar">↻</button>
      <button id="help-open" class="help-btn" data-i18n-aria="helpAria" aria-label="Ayuda">?</button>
      <button id="lang-toggle" class="help-btn lang-btn" aria-label="Change language">EN</button>
    </div>
    <div class="filters">
      <button class="filter-btn active" data-type="all" data-i18n="filters.all">Todos</button>
      <button class="filter-btn active" data-type="EQ" data-i18n="filters.EQ">Terremotos</button>
      <button class="filter-btn active" data-type="TC" data-i18n="filters.TC">Ciclones</button>
      <button class="filter-btn active" data-type="FL" data-i18n="filters.FL">Inundaciones</button>
      <button class="filter-btn active" data-type="VO" data-i18n="filters.VO">Volcanes</button>
      <button class="filter-btn active" data-type="DR" data-i18n="filters.DR">Sequías</button>
      <button class="filter-btn active" data-type="WF" data-i18n="filters.WF">Incendios</button>
    </div>
    <div class="alert-filters">
      <button class="alert-btn active" data-level="green" data-i18n="levels.green">Verde</button>
      <button class="alert-btn active" data-level="orange" data-i18n="levels.orange">Naranja</button>
      <button class="alert-btn active" data-level="red" data-i18n="levels.red">Rojo</button>
    </div>
    <div class="extra-filters">
      <button id="local-quake-toggle" class="local-quake-btn" data-i18n="filters.localQuakes">Sismos locales</button>
    </div>
    <div id="update-banner" class="update-banner hidden">
      <span data-i18n="update.available">Hay una nueva versión disponible.</span>
      <button id="update-reload-btn" data-i18n="update.reload">Recargar</button>
    </div>
  </header>

  <main id="map"></main>

  <aside id="panel" class="panel hidden">
    <button id="panel-close" data-i18n-aria="closeAria" aria-label="Cerrar">×</button>
    <div id="panel-content"></div>
  </aside>

  <aside id="help-panel" class="panel hidden">
    <button id="help-close" data-i18n-aria="closeAria" aria-label="Cerrar">×</button>
    <div id="help-body" class="help-content"></div>
  </aside>

  <div id="error-banner" class="error-banner hidden"></div>
  <div id="loading-banner" class="loading-banner" data-i18n="loading">Cargando eventos…</div>
  <div id="map-attribution" class="map-attribution"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="script.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
